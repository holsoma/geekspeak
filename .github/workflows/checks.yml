name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check the guest learning flow
        run: |
          npm run start -- --hostname 127.0.0.1 --port 4400 > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:4400/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          npm run test:e2e
